<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Geografie">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f4f7fc">
<title>Geografie</title>
<style>
:root{--bg:#f4f7fc;--card:#fff;--tx:#1d2433;--mu:#5d6882;--pr:#2f6fed;--ok:#1f9d55;--bad:#d64545;--bd:#dfe5f1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141d;--card:#1a2030;--tx:#eef1f8;--mu:#9aa6c2;--pr:#6b9bff;--ok:#43c47c;--bad:#ff7a7a;--bd:#2b3348;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141d;--card:#1a2030;--tx:#eef1f8;--mu:#9aa6c2;--pr:#6b9bff;--ok:#43c47c;--bad:#ff7a7a;--bd:#2b3348;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
nav a{white-space:nowrap;text-decoration:none;color:var(--mu);padding:8px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--card);font-size:15px}
nav a.on{background:var(--pr);color:#fff;border-color:var(--pr)}
h1{font-size:28px;margin:8px 0}h2{font-size:22px;margin:16px 0 8px}
.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:block;text-decoration:none;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px 12px;text-align:center;font-weight:600}
.tile span{display:block;font-size:34px}
button,.btn{font:inherit;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;text-decoration:none;display:inline-block;margin:4px 4px 4px 0}
button.p,.btn.p{background:var(--pr);color:#fff;border-color:var(--pr)}
button.on{border-color:var(--pr);color:var(--pr);font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
input,select,textarea{font:inherit;width:100%;min-height:48px;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:4px 0}
textarea{min-height:110px}
.big{font-size:32px;font-weight:700;margin:8px 0}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.good{color:var(--ok);font-weight:600}.badc{color:var(--bad);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.spk{min-height:40px;padding:2px 10px;margin:0 0 0 8px;font-size:20px;vertical-align:middle}.colb{display:inline-flex;align-items:center;gap:8px;border-width:2px}.colb i{width:18px;height:18px;border-radius:50%;display:inline-block}.logo{flex:none;display:inline-block;line-height:0}
.sub{margin:0 0 4px 34px;display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.txt{background:var(--bg);border-left:4px solid var(--pr);padding:10px 12px;border-radius:8px;font-size:16px;line-height:1.5;margin-bottom:12px}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid var(--bd)}.chk input{width:26px;height:26px;min-height:0;margin:0;flex:none}.chk span:first-of-type{flex:1}
@media (max-width:420px){.grid{gap:8px}body{font-size:17px}}
.map{width:100%;max-height:65vh;display:block;background:#c6ecff;border-radius:10px}.rg{fill:#fefee9;stroke:#777;stroke-width:2;fill-rule:evenodd;cursor:pointer}.im .rg{fill:transparent;stroke:none}.co{fill:none;stroke:#1a85b8;stroke-width:3;pointer-events:none}.rg.hi{fill:var(--pr);fill-opacity:.6}.rg.ok{fill:#2fb35a;fill-opacity:.65}.rg.bad{fill:#e04040;fill-opacity:.65}
.hit{fill:none;stroke:transparent;stroke-width:22;pointer-events:stroke;cursor:pointer}.ctx{cursor:default}
</style>
</head>
<body>
<main>
<nav id="nav"></nav>
<div id="app"></div>
</main>
<!-- 1) Inhalte (hier pflegst du Fächer, Units, Aufgaben) -->
<script src="maps.js"></script>
<script src="content.js"></script>
<!-- 2) Allgemeine App-Logik (normalerweise nicht ändern) -->
<script src="app.js"></script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
